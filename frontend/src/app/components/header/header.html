<header class="header flex items-center justify-between py-5">
	<a class="brand inline-flex items-center gap-2 no-underline" routerLink="/home"><span class="brand-dot"></span>calory</a>
	<nav class="flex items-center gap-5 text-sm" aria-label="Main navigation">
		@if (signedIn) {
			<a routerLink="/home">Today</a>
			<a routerLink="/query">Food journal</a>
			<a routerLink="/goals/history">Goals</a>
			<div class="account-menu">
				<button type="button" class="profile-trigger" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()"><span class="profile-badge">{{ user()?.firstName?.charAt(0) ?? '?' }}</span><span class="profile-name">{{ user()?.firstName ?? 'Profile' }} {{ user()?.lastName ?? '' }}</span><span class="menu-chevron" aria-hidden="true">▾</span></button>
				@if (menuOpen()) {
					<div class="menu-panel" role="menu">
						<div class="menu-identity"><strong>{{ user()?.firstName }} {{ user()?.lastName }}</strong><span>{{ user()?.email }}</span></div>
						<button type="button" role="menuitem" (click)="openProfile()">Edit profile <span>↗</span></button>
						<button type="button" role="menuitem" (click)="logout()">Sign out <span>↗</span></button>
					</div>
				}
			</div>
		} @else {
			<a routerLink="/login">Sign in</a>
			<a class="nav-cta rounded px-4 py-2 no-underline" routerLink="/register">Join free</a>
		}
	</nav>
</header>
@if (profileOpen()) { <app-user-profile [user]="user()" (saved)="profileSaved($event)" (closed)="profileOpen.set(false)" /> }
