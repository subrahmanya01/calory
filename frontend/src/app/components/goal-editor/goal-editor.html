<section
  class="fixed inset-0 z-10 grid place-items-center bg-[#27352f]/35 p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="goal-title"
>
  <form
    class="max-h-[92vh] w-full max-w-2xl overflow-auto rounded-lg bg-[#fffdf7] p-6 shadow-2xl sm:p-8"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <div class="mb-6 flex items-start justify-between gap-4">
      <div>
        <p class="eyebrow">Personal calibration</p>
        <h2 id="goal-title" class="font-serif text-4xl font-normal tracking-[-.05em]">
          {{ goal ? 'Edit your goal.' : 'Set your goal.' }}
        </h2>
        <p class="mt-2 text-sm text-[#718077]">Targets are a compass, not a verdict.</p>
      </div>
      <button
        class="text-2xl text-[#718077]"
        type="button"
        aria-label="Close"
        (click)="closed.emit()"
      >
        ×
      </button>
    </div>
    @if (error()) {
      <p class="mb-4 rounded bg-[#fff0e9] p-3 text-sm text-[#a64d3e]">{{ error() }}</p>
    }
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="field sm:col-span-2"
        >Daily calories <input type="number" formControlName="dailyCalorieTarget"
      /></label>
      <label class="field"
        >Protein (g) <input type="number" formControlName="proteinTarget"
      /></label>
      <label class="field"
        >Carbohydrates (g) <input type="number" formControlName="carbTarget"
      /></label>
      <label class="field">Fat (g) <input type="number" formControlName="fatTarget" /></label>
      <label class="field"
        >Weight target <input type="number" formControlName="weightTarget"
      /></label>
      <label class="field">Start date <input type="date" formControlName="startDate" /></label>
      <label class="field"
        >End date <span class="font-normal text-[#8b978e]">optional</span
        ><input type="date" formControlName="endDate"
      /></label>
    </div>
    <div class="mt-7 flex justify-end gap-3">
      <button class="secondary-button" type="button" (click)="closed.emit()">Cancel</button
      ><button class="primary-button" type="submit" [disabled]="saving()">
        @if (saving()) {
          <app-spinner />
        } @else {
          Save goal <span>↗</span>
        }
      </button>
    </div>
  </form>
</section>
